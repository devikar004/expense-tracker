<!DOCTYPE html>
<html>

<head>
    <title>Expense Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        input, select, button {
            padding: 9px;
            margin: 5px;
        }

        button {
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #eee;
        }

        .summary {
            display: flex;
            gap: 20px;
        }

        .summary div {
            background: white;
            padding: 20px;
            flex: 1;
            border-radius: 8px;
        }

        #total {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>Personal Expense Tracker</h1>



<div class="summary">

    <div>
        <h3>Current Month</h3>
        <div id="month"></div>
    </div>

    <div>
        <h3>Total Spent</h3>
        <div id="total">₹0</div>
    </div>

    <div>
        <h3>Category Breakdown</h3>
        <div id="breakdown"></div>
    </div>

</div>



<div class="card">

    <h2>Add Expense</h2>

    <input id="title"
           placeholder="Title">

    <input id="amount"
           type="number"
           placeholder="Amount">

    <select id="category">
        <option value="">Select Category</option>
        <option>Food</option>
        <option>Transport</option>
        <option>Shopping</option>
        <option>Bills</option>
        <option>Entertainment</option>
        <option>Other</option>
    </select>

    <input id="date"
           type="date">

    <input id="note"
           placeholder="Note">

    <button onclick="addExpense()">
        Add Expense
    </button>

</div>




<div class="card">

    <h2>Filter Expenses</h2>

    <input id="searchTitle"
           placeholder="Search title">

    <select id="filterCategory">

        <option value="">All Categories</option>

        <option>Food</option>
        <option>Transport</option>
        <option>Shopping</option>
        <option>Bills</option>
        <option>Entertainment</option>
        <option>Other</option>

    </select>

    <label>From:</label>

    <input id="fromDate"
           type="date">

    <label>To:</label>

    <input id="toDate"
           type="date">

    <button onclick="loadExpenses()">
        Filter
    </button>

    <button onclick="clearFilters()">
        Clear
    </button>

</div>



<div class="card">

    <h2>Expenses</h2>

    <table>

        <thead>

        <tr>
            <th>Date</th>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Note</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody id="expenseTable">

        </tbody>

    </table>

</div>


<script>

let editingId = null;


document.getElementById("date").value =
    new Date().toISOString().split("T")[0];



async function loadExpenses() {

    const category =
        document.getElementById("filterCategory").value;

    const title =
        document.getElementById("searchTitle").value;

    const from =
        document.getElementById("fromDate").value;

    const to =
        document.getElementById("toDate").value;

    if (from && to && from > to) {
        alert("From date cannot be after To date");
        return;
    }

    const params = new URLSearchParams();

    if (category)
        params.append("category", category);

    if (title)
        params.append("title", title);

    if (from)
        params.append("from", from);

    if (to)
        params.append("to", to);

    const response =
        await fetch("/api/expenses?" + params);

    const expenses =
        await response.json();

    const table =
        document.getElementById("expenseTable");

    table.innerHTML = "";

    if (expenses.length === 0) {

        table.innerHTML =
            `<tr>
                <td colspan="6">
                    No expenses found.
                </td>
             </tr>`;

        return;
    }

    expenses.forEach(expense => {

        table.innerHTML += `

        <tr>

            <td>${expense.date}</td>

            <td>${escapeHTML(expense.title)}</td>

            <td>₹${expense.amount.toFixed(2)}</td>

            <td>${expense.category}</td>

            <td>${escapeHTML(expense.note || "")}</td>

            <td>

                <button
                    onclick='editExpense(${JSON.stringify(expense)})'>
                    Edit
                </button>

                <button
                    onclick="deleteExpense(${expense.id})">
                    Delete
                </button>

            </td>

        </tr>

        `;
    });
}


async function addExpense() {

    const title =
        document.getElementById("title").value.trim();

    const amount =
        document.getElementById("amount").value;

    const category =
        document.getElementById("category").value;

    const expenseDate =
        document.getElementById("date").value;

    const note =
        document.getElementById("note").value.trim();


    if (!title) {
        alert("Title is required");
        return;
    }

    if (!amount || Number(amount) <= 0) {
        alert("Amount must be greater than 0");
        return;
    }

    if (!category) {
        alert("Please select a category");
        return;
    }


    const data = {
        title: title,
        amount: amount,
        category: category,
        date: expenseDate,
        note: note
    };


    let url = "/api/expenses";
    let method = "POST";

    if (editingId) {

        url = `/api/expenses/${editingId}`;
        method = "PUT";

    }


    const response = await fetch(url, {

        method: method,

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(data)

    });


    const result = await response.json();


    if (!response.ok) {

        alert(result.error);
        return;

    }


    editingId = null;

    clearForm();

    loadExpenses();

    loadSummary();

}



function editExpense(expense) {

    editingId = expense.id;

    document.getElementById("title").value =
        expense.title;

    document.getElementById("amount").value =
        expense.amount;

    document.getElementById("category").value =
        expense.category;

    document.getElementById("date").value =
        expense.date;

    document.getElementById("note").value =
        expense.note || "";

    window.scrollTo(0, 0);
}



async function deleteExpense(id) {

    if (!confirm("Are you sure you want to delete this expense?")) {
        return;
    }

    await fetch(`/api/expenses/${id}`, {
        method: "DELETE"
    });

    loadExpenses();
    loadSummary();
}



function clearForm() {

    document.getElementById("title").value = "";
    document.getElementById("amount").value = "";
    document.getElementById("category").value = "";
    document.getElementById("note").value = "";

    document.getElementById("date").value =
        new Date().toISOString().split("T")[0];

    editingId = null;
}



function clearFilters() {

    document.getElementById("searchTitle").value = "";
    document.getElementById("filterCategory").value = "";
    document.getElementById("fromDate").value = "";
    document.getElementById("toDate").value = "";

    loadExpenses();
}



async function loadSummary() {

    const response =
        await fetch("/api/summary");

    const data =
        await response.json();

    document.getElementById("month").innerText =
        data.month;

    document.getElementById("total").innerText =
        "₹" + data.total.toFixed(2);


    let html = "";

    for (const category in data.breakdown) {

        html += `
            <div>
                ${category}:
                ₹${data.breakdown[category].toFixed(2)}
            </div>
        `;

    }

    document.getElementById("breakdown").innerHTML =
        html || "No expenses this month";
}

async function loadSummary() {

    const response = await fetch("/api/summary");

    const data = await response.json();

  
    document.getElementById("month").innerText =
        data.month;

  
    document.getElementById("total").innerText =
        "₹" + Number(data.total).toFixed(2);

    
    let html = "";

    const categories = [
        "Food",
        "Transport",
        "Shopping",
        "Bills",
        "Entertainment",
        "Other"
    ];

    categories.forEach(category => {

        const amount =
            data.breakdown[category] || 0;

        html += `
            <div>
                ${category}: ₹${Number(amount).toFixed(2)}
            </div>
        `;
    });

    document.getElementById("breakdown").innerHTML =
        html;
}



function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}



loadExpenses();
loadSummary();

</script>

</body>
</html>
